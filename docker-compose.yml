# Optional local stack — not required for normal npm start
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - kujto_mongo:/data/db

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/kujto-tiranen
      JWT_SECRET: docker_dev_secret_change_me_in_production_48chars
      ADMIN_EMAIL: admin@kujtotiranen.al
      ADMIN_PASSWORD: Admin123!
      NODE_ENV: development
      FRONTEND_URL: http://localhost:5000
    depends_on:
      - mongo

volumes:
  kujto_mongo:
